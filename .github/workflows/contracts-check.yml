name: contracts-check

on:
  pull_request:
    paths:
      - contracts/src/**

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The version is bumped
        run: |
          base=$(git show "origin/${{ github.base_ref }}:contracts/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          head=$(node -p "require('./contracts/package.json').version")
          if [ "$base" = "$head" ]; then
            echo "::error::contracts changed but the version is still $head; bump it in contracts/package.json"
            exit 1
          fi
      - name: The contracts compile
        working-directory: contracts
        run: |
          npm ci
          npm run compile
